name: Auto Assign PR Author
description: Assigns a pull request to its author unless the author is a bot or the PR already has an assignee

runs:
  using: composite
  steps:
    - name: Assign PR author
      if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.assignees[0] == null
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        AUTHOR: ${{ github.event.pull_request.user.login }}
      run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-assignee "$AUTHOR"
