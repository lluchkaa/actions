name: Assign Author
description: Assigns an issue or pull request to its author unless the author is a bot or it already has an assignee

runs:
  using: composite
  steps:
    - name: Assign author
      if: |
        (github.event.issue.user.type != 'Bot' && github.event.issue.assignees[0] == null) ||
        (github.event.pull_request.user.type != 'Bot' && github.event.pull_request.assignees[0] == null)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        AUTHOR: ${{ github.event.issue.user.login || github.event.pull_request.user.login }}
        KIND: ${{ github.event.issue && 'issue' || 'pr' }}
      run: gh "$KIND" edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-assignee "$AUTHOR"
